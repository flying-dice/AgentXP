name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # scripts/test.mjs runs vitest under ELECTRON_RUN_AS_NODE, which needs no display.
      - run: npm test
      # Selector rule only: e2e specs may locate elements with getByTestId and nothing else.
      - run: node scripts/check-e2e-selectors.mjs
      # Every data-testid of the UI is in a manual.
      - run: npm run help:coverage
      - run: npm run testids
      # Every app has UI, backend, agent API, e2e and docs, or a recorded reason (docs/APP_PILLARS.md).
      - run: npm run app:pillars
      - run: npx electron-vite build
      - run: npm run build-storybook
      # Full Playwright e2e on the built app, headless under xvfb (Electron needs a display).
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: A7_E2E_SKIP_BUILD=1 npm run test:e2e
